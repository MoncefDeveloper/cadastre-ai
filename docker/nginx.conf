server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /var/www/html/public;

    # Fix the 2MB upload limit: Allow high-res property photo uploads up to 32MB
    client_max_body_size 32M;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    index index.php;

    charset utf-8;

    # Gzip Compression for fast mobile loading
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Cache Vite compiled assets (Tailwind v4 CSS & JS) for 1 year
    location ~* ^/build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Route property images from storage
    location /storage/ {
        add_header Access-Control-Allow-Origin "*";
        expires 30d;
        access_log off;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    # Pass all PHP scripts to PHP-FPM running internally on port 9000
    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_buffer_size 16k;
        fastcgi_buffers 4 16k;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
